name: Bug report
description: Something is not working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes: { label: What happened, description: Include steps to reproduce. }
    validations: { required: true }
  - type: textarea
    id: expected
    attributes: { label: What you expected }
  - type: input
    id: version
    attributes: { label: Version or commit }
  - type: dropdown
    id: where
    attributes:
      label: Where
      options: [Server, CLI, App (web), App (iOS), App (Android), App (desktop), Self-host install]
