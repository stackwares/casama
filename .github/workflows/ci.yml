name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, typecheck, tests
    runs-on: ubuntu-24.04
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Postgres extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector
          curl -sL https://github.com/theory/pgtap/archive/refs/tags/v1.3.3.tar.gz | tar xz
          (cd pgtap-1.3.3 && make PG_CONFIG=$PG_BIN/pg_config && sudo make install PG_CONFIG=$PG_BIN/pg_config)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SKIP_DOCKER_TESTS: "1"
      - name: pgTAP (RLS)
        run: pnpm --filter @kasama/db test:pgtap
      - name: Generated code is up to date (OpenAPI, Dart client, Drizzle schema)
        run: |
          pnpm gen
          pnpm --filter @kasama/db pull
          git diff --exit-code -- packages/contracts/openapi.json dart/kasama_api/lib dart/kasama_sdk/lib/src/generated packages/db/src/generated
      - name: Dart analyze and test
        working-directory: dart
        run: |
          dart pub get
          dart analyze
          dart test cli kasama_sdk computerd
      - name: Build sandbox images
        run: |
          docker build -q -f infra/images/computer/Dockerfile.headless -t kasama/computer-headless:dev .
          docker build -q -f apps/supervisor/Dockerfile -t kasama/supervisor:dev .
          docker build -q -f infra/egress-proxy/Dockerfile -t kasama/egress-proxy:dev .
      - name: Sandbox and computer tests (Docker)
        run: pnpm --filter @kasama/sandbox --filter @kasama/server test
      - name: Dart computerd tests
        working-directory: dart
        run: dart test computerd
      - name: CLI end to end (phase gates, with computers)
        env:
          E2E_SANDBOX: "1"
        run: ./scripts/e2e-cli.sh

  app:
    name: Flutter app (analyze, widget tests, web build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Analyze and test
        working-directory: client
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test
          flutter build web --release

  supabase:
    name: RLS tests on the real Supabase stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase test db

  image:
    name: Server image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: kasama/server:ci
