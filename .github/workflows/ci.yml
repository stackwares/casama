name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, typecheck, tests
    runs-on: ubuntu-24.04
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Postgres extensions
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-16-pgvector
          curl -sL https://github.com/theory/pgtap/archive/refs/tags/v1.3.3.tar.gz | tar xz
          (cd pgtap-1.3.3 && make PG_CONFIG=$PG_BIN/pg_config && sudo make install PG_CONFIG=$PG_BIN/pg_config)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: pgTAP (RLS)
        run: pnpm --filter @kasama/db test:pgtap
      - name: Generated code is up to date (OpenAPI, Dart client, Drizzle schema)
        run: |
          pnpm gen
          pnpm --filter @kasama/db pull
          git diff --exit-code -- packages/contracts/openapi.json dart/kasama_api/lib dart/kasama_sdk/lib/src/generated packages/db/src/generated
      - name: Dart analyze and test
        working-directory: dart
        run: |
          dart pub get
          dart analyze
          dart test cli kasama_sdk
      - name: CLI end to end (Phase 0 gate)
        run: ./scripts/e2e-cli.sh

  supabase:
    name: RLS tests on the real Supabase stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with: { version: latest }
      - run: supabase db start
      - run: supabase test db

  image:
    name: Server image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: kasama/server:ci
