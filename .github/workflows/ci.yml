name: CI
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Lint, typecheck, tests
    runs-on: ubuntu-24.04
    env:
      PG_BIN: /usr/lib/postgresql/16/bin
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: pnpm }
      - uses: actions/setup-java@v6
        with: { distribution: temurin, java-version: 17 }
      - uses: dart-lang/setup-dart@v1
        with: { sdk: stable }
      - name: Postgres extensions
        run: |
          # The runners' Azure apt mirror sometimes doesn't resolve: use Ubuntu's archive and retry.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y postgresql-16-pgvector && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
          # Build pgTAP outside the checkout so Biome doesn't lint its files.
          cd "$RUNNER_TEMP"
          curl -sL https://github.com/theory/pgtap/archive/refs/tags/v1.3.3.tar.gz | tar xz
          (cd pgtap-1.3.3 && make PG_CONFIG=$PG_BIN/pg_config && sudo make install PG_CONFIG=$PG_BIN/pg_config)
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
        env:
          SKIP_DOCKER_TESTS: "1"
      - name: pgTAP (RLS)
        run: pnpm --filter @casama/db test:pgtap
      - name: Generated code is up to date (OpenAPI, Dart client, Drizzle schema)
        run: |
          pnpm gen
          pnpm --filter @casama/db pull
          git diff --exit-code -- packages/contracts/openapi.json dart/casama_api/lib dart/casama_sdk/lib/src/generated packages/db/src/generated
      - name: Dart analyze and test
        working-directory: dart
        run: |
          dart pub get
          dart analyze
          dart test cli casama_sdk computerd
      - name: Build sandbox images
        run: |
          docker build -q -f infra/images/computer/Dockerfile.headless -t casama/computer-headless:dev .
          docker build -q -f apps/supervisor/Dockerfile -t casama/supervisor:dev .
          docker build -q -f infra/egress-proxy/Dockerfile -t casama/egress-proxy:dev .
      - name: Sandbox and computer tests (Docker)
        run: pnpm --filter @casama/sandbox --filter @casama/server test
      - name: Dart computerd tests
        working-directory: dart
        run: dart test computerd
      - name: CLI end to end (phase gates, with computers)
        env:
          E2E_SANDBOX: "1"
        run: ./scripts/e2e-cli.sh

  app:
    name: Flutter app (analyze, widget tests, web build)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { channel: stable, cache: true }
      - name: Native build packages (cnativeapi builds against GTK 3, X11 and Xi on Linux)
        run: |
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            echo "http://archive.ubuntu.com/ubuntu/	priority:1" | sudo tee /etc/apt/apt-mirrors.txt >/dev/null
          fi
          for i in 1 2 3; do
            sudo apt-get update && sudo apt-get install -y pkg-config libgtk-3-dev libx11-dev libxi-dev && break
            [ "$i" = 3 ] && exit 1
            sleep 20
          done
      - name: Analyze and test
        working-directory: client
        run: |
          flutter pub get
          flutter gen-l10n
          flutter analyze
          flutter test
      - name: Release web build (Wasm)
        run: scripts/build-web.sh

  supabase:
    name: RLS tests on the real Supabase stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v3
        with: { version: latest }
      - run: supabase db start
      - run: supabase test db

  image:
    name: Server image builds
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          tags: casama/server:ci
