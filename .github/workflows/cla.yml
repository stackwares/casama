# The CLA check on pull requests (D-407). Every contributor signs CLA.md once, by commenting on
# their pull request with the exact sentence below; the check records the signature in
# signatures/cla.json on the cla-signatures branch and goes green on every later pull request.
# Comment "recheck" to run it again. Stackwares' own account and bots don't need to sign.
#
# pull_request_target is safe here: the action never checks out or runs the pull request's code.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, reopened, synchronize, closed]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'pull_request_target' ||
      (github.event.issue.pull_request &&
        (github.event.comment.body == 'recheck' ||
         github.event.comment.body == 'I have read the Casama CLA (CLA.md) and I agree to it.'))
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/stackwares/casama/blob/main/CLA.md
          path-to-signatures: signatures/cla.json
          branch: cla-signatures
          allowlist: oliverbytes,dependabot[bot],github-actions[bot],*[bot]
          lock-pullrequest-aftermerge: false
          custom-pr-sign-comment: I have read the Casama CLA (CLA.md) and I agree to it.
          custom-notsigned-prcomment: >-
            Thanks for the pull request! Before it can be merged, please read the
            [Casama Contributor License Agreement](https://github.com/stackwares/casama/blob/main/CLA.md)
            and sign it by commenting with exactly the sentence below. You sign once; it covers
            your later pull requests too, and you keep your copyright.
          custom-allsigned-prcomment: Everyone on this pull request has signed the Casama CLA. Thank you!
