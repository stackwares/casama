name: Release CLI and SDK
# On a cli-v* tag: native CLI binaries for macOS, Linux and Windows attached to a GitHub release,
# plus the Homebrew formula. Publishing casama_api and casama_sdk to pub.dev is a separate,
# manual job (it needs a pub.dev publisher and a maintainer's approval).
on:
  push:
    tags: ["cli-v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - { os: macos-15, target: darwin-arm64 }
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-24.04, target: linux-x64 }
          - { os: ubuntu-24.04-arm, target: linux-arm64 }
          - { os: windows-2025, target: windows-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
      - name: Build
        shell: bash
        run: |
          v=$(grep '^version:' dart/cli/pubspec.yaml | awk '{print $2}')
          cd dart && dart pub get && cd cli
          ext=""; [[ "${{ matrix.target }}" == windows-* ]] && ext=".exe"
          mkdir -p ../../dist/pkg && dart compile exe bin/casama.dart -o ../../dist/pkg/casama$ext
          cd ../../dist
          name="casama-$v-${{ matrix.target }}"
          if [[ -n "$ext" ]]; then (cd pkg && 7z a "../$name.zip" casama.exe >/dev/null); sha256sum "$name.zip" > "$name.zip.sha256"
          else tar -C pkg -czf "$name.tar.gz" casama; shasum -a 256 "$name.tar.gz" > "$name.tar.gz.sha256"; fi
      - uses: actions/upload-artifact@v4
        with:
          name: cli-${{ matrix.target }}
          path: dist/casama-*

  release:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist, merge-multiple: true }
      - name: Formula and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep '^version:' dart/cli/pubspec.yaml | awk '{print $2}')
          scripts/homebrew-formula.sh "$v" dist > dist/casama.rb
          gh release create "cli-v$v" dist/* --title "Casama CLI $v" --notes "See CHANGELOG.md" --draft
