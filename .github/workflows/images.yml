name: Images
# Builds the server, supervisor, egress proxy and computer images for amd64 and arm64.
# Build only: publishing to GHCR is a manual decision (no automatic deploys).
on:
  pull_request:
    paths: ["infra/**", "dart/computerd/**", "apps/supervisor/**", "apps/server/**", "packages/**"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: server, file: apps/server/Dockerfile }
          - { name: supervisor, file: apps/supervisor/Dockerfile }
          - { name: egress-proxy, file: infra/egress-proxy/Dockerfile }
          - { name: computer-headless, file: infra/images/computer/Dockerfile.headless }
          - { name: turn, file: infra/turn/Dockerfile }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: linux/amd64,linux/arm64
          push: false
          tags: kasama/${{ matrix.name }}:ci

  # The desktop image builds on the headless one (Neko is compiled in it, D-054).
  desktop:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/computer/Dockerfile.headless
          load: true
          tags: kasama/computer-headless:ci
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/images/computer/Dockerfile.desktop
          build-args: BASE=kasama/computer-headless:ci
          push: false
          tags: kasama/computer-desktop:ci
