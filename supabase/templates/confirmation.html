<!doctype html>
<html>
  <body style="margin:0;padding:32px 16px;background:#f6f6f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;color:#1f1f1f">
    <table role="presentation" width="100%" style="max-width:440px;margin:0 auto;background:#ffffff;border-radius:16px;padding:32px">
      <tr><td>
        <h1 style="margin:0 0 12px;font-size:22px">Welcome to Kasama</h1>
        <p style="margin:0 0 20px;font-size:15px;line-height:1.5;color:#444">Tap the button to confirm your email and sign in, or type this code in the app:</p>
        <p style="margin:0 0 24px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center">{{ .Token }}</p>
        <p style="margin:0 0 24px;text-align:center">
          <a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#1f1f1f;color:#ffffff;text-decoration:none;font-weight:600;padding:12px 28px;border-radius:999px">Confirm and sign in</a>
        </p>
        <p style="margin:0;font-size:13px;line-height:1.5;color:#777">The link and code work once and expire in an hour. If you didn't ask for this, you can ignore this email.</p>
      </td></tr>
    </table>
  </body>
</html>
