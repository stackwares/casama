<title>Installer background</title>

body { background: #efe8f7 url("/visuals/cards/dmg.jpg") center / cover no-repeat; }
svg { position: absolute; left: 0; top: 0; }
</style>
</head>
<body>
<svg width="660" height="400" viewBox="0 0 660 400" aria-hidden="true">

  <path d="M380 174 L 400 192 L 376 202" fill="none" stroke="#6b4fd8" stroke-opacity=".55" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
