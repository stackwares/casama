{{- $s := .Values.secrets -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-supabase
  labels: {{- include "kasama.labels" . | nindent 4 }}
type: Opaque
stringData:
  anonKey: {{ required "supabase.anonKey is required" .Values.supabase.anonKey | quote }}
  serviceRoleKey: {{ required "supabase.serviceRoleKey is required" .Values.supabase.serviceRoleKey | quote }}
  jwtSecret: {{ required "supabase.jwtSecret is required" .Values.supabase.jwtSecret | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-database
  labels: {{- include "kasama.labels" . | nindent 4 }}
type: Opaque
stringData:
  url: {{ required "database.url is required" .Values.database.url | quote }}
  workerUrl: {{ default .Values.database.url .Values.database.workerUrl | quote }}
  adminUrl: {{ default .Values.database.url .Values.database.adminUrl | quote }}
{{- if not .Values.existingSecret }}
---
{{- /* Generated once and kept across upgrades. */}}
{{- $old := (lookup "v1" "Secret" .Release.Namespace (printf "%s-secrets" .Release.Name)).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-secrets
  labels: {{- include "kasama.labels" . | nindent 4 }}
  annotations: { "helm.sh/resource-policy": keep }
type: Opaque
data:
  {{- /* A value given in values wins, then the one already in the cluster, then a new random one. */}}
  INTERNAL_TOKEN: {{ $s.internalToken | b64enc | default (get $old "INTERNAL_TOKEN") | default (randAlphaNum 48 | b64enc) }}
  SUPERVISOR_TOKEN: {{ $s.supervisorToken | b64enc | default (get $old "SUPERVISOR_TOKEN") | default (randAlphaNum 48 | b64enc) }}
  COMPUTER_TOKEN_SECRET: {{ $s.computerTokenSecret | b64enc | default (get $old "COMPUTER_TOKEN_SECRET") | default (randAlphaNum 48 | b64enc) }}
  METRICS_TOKEN: {{ $s.metricsToken | b64enc | default (get $old "METRICS_TOKEN") | default (randAlphaNum 32 | b64enc) }}
  {{- with $s.contentEncryptionKey }}
  CONTENT_ENCRYPTION_KEY: {{ . | b64enc }}
  {{- end }}
{{- end }}
