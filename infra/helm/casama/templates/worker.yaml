apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels: {{- include "casama.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.worker.replicas }}
  selector: { matchLabels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/instance: {{ .Release.Name }}, app.kubernetes.io/component: worker } }
    spec:
      {{- with .Values.image.pullSecrets }}
      imagePullSecrets: {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: worker
          image: {{ include "casama.image" (dict "root" . "name" "server") }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            {{- include "casama.env" . | nindent 12 }}
            - { name: MODE, value: worker }
            - { name: RUN_CONCURRENCY, value: {{ .Values.worker.runConcurrency | quote }} }
            - { name: WORKER_DATABASE_URL, valueFrom: { secretKeyRef: { name: {{ .Release.Name }}-database, key: workerUrl } } }
          resources: {{- toYaml .Values.worker.resources | nindent 12 }}
