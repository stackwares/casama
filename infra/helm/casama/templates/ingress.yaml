{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}
  labels: {{- include "casama.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- with .Values.ingress.tls }}
  tls: {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.apiHost | quote }}
      http:
        paths:
          {{- range $p := list "/v1" "/hooks" "/healthz" "/a2a" "/links" "/oauth" "/mcp" "/.well-known" "/telephony" "/internal" "/metrics" }}
          - { path: {{ $p }}, pathType: Prefix, backend: { service: { name: {{ $.Release.Name }}-api, port: { name: http } } } }
          {{- end }}
          {{- if .Values.web.enabled }}
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-web, port: { name: http } } } }
          {{- end }}
    - host: {{ .Values.ingress.pagesHost | quote }}
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: {{ .Release.Name }}-api, port: { name: pages } } } }
{{- end }}
