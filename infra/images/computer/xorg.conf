# A dummy X server (no GPU, no input devices: the XTEST virtual core devices are enough). Neko and xdotool inject input through XTEST;
# the dummy driver supports RandR so the screen can be resized at runtime.
Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
  Option "PciForceNone" "true"
  Option "AutoEnableDevices" "false"
  Option "AutoAddDevices" "false"
EndSection

Section "Device"
  Identifier "dummy_videocard"
  Driver "dummy"
  Option "ConstantDPI" "true"
  VideoRam 256000
EndSection

Section "Monitor"
  Identifier "dummy_monitor"
  HorizSync 5.0 - 1000.0
  VertRefresh 5.0 - 200.0
  Modeline "1920x1080_30.00" 79.75 1920 1976 2168 2416 1080 1083 1088 1102 -hsync +vsync
  Modeline "1280x800_30.00" 39.75 1280 1312 1432 1584 800 803 809 838 -hsync +vsync
  Modeline "1280x720_30.00" 36.00 1280 1312 1424 1568 720 723 728 748 -hsync +vsync
  Modeline "1024x768_30.00" 30.75 1024 1048 1144 1264 768 771 775 790 -hsync +vsync
EndSection

Section "Screen"
  Identifier "dummy_screen"
  Device "dummy_videocard"
  Monitor "dummy_monitor"
  DefaultDepth 24
  SubSection "Display"
    Viewport 0 0
    Depth 24
    Modes "1280x800_30.00" "1920x1080_30.00" "1280x720_30.00" "1024x768_30.00"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier "dummy_layout"
  Screen "dummy_screen"
EndSection
