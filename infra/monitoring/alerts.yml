# Alert rules from SPEC "Observability": run failures above 5% over 15 minutes, and the sandbox
# host above 85% memory. Route them with Alertmanager (or Grafana alerting) to email or chat.
groups:
  - name: kasama
    rules:
      - alert: KasamaRunFailuresHigh
        expr: kasama_run_failure_ratio_15m > 0.05 and sum(kasama_runs_15m{status=~"completed|failed"}) >= 20
        for: 5m
        labels: { severity: page }
        annotations:
          summary: "More than 5% of runs failed in the last 15 minutes"
      - alert: KasamaSandboxMemoryHigh
        expr: (1 - node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes) > 0.85
        for: 10m
        labels: { severity: page }
        annotations:
          summary: "Host {{ $labels.instance }} is above 85% memory"
      - alert: KasamaTimeToFirstTokenSlow
        expr: kasama_time_to_first_token_seconds{quantile="0.95"} > 3
        for: 15m
        labels: { severity: warn }
        annotations:
          summary: "p95 time to first token is above 3 s"
      - alert: KasamaQueueBacklog
        expr: sum(kasama_queue_depth{queue="runs"}) > 200
        for: 10m
        labels: { severity: warn }
        annotations:
          summary: "More than 200 runs waiting in the queue"
      - alert: KasamaApiDown
        expr: up{job="kasama-api"} == 0
        for: 2m
        labels: { severity: page }
        annotations:
          summary: "The Kasama API is not answering /metrics"
