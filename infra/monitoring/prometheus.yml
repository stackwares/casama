# Scrapes the Casama API (/metrics) and node-exporter on each host. Used by the `monitoring`
# compose profile (infra/compose/docker-compose.yml); edit targets for multi-host installs.
global:
  scrape_interval: 30s
  evaluation_interval: 30s
rule_files:
  - /etc/prometheus/alerts.yml
# Alerts go to the owner by email through Alertmanager (D-272).
alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]
scrape_configs:
  - job_name: casama-api
    metrics_path: /metrics
    authorization:
      # Written by the container's entrypoint from METRICS_TOKEN (D-272: it pointed elsewhere, so
      # every scrape failed and CasamaApiDown fired on a healthy server).
      credentials_file: /tmp/metrics_token
    static_configs:
      - targets: ["api:8787"]
  - job_name: node
    static_configs:
      # Add the sandbox host's node-exporter here when computers run on a second machine.
      - targets: ["node-exporter:9100"]
        labels: { role: app }
