# Casama self-host stack (SPEC "Self-host"): Supabase (Postgres, Auth, REST, Realtime, gateway),
# the Casama API and worker, the sandbox supervisor, egress proxy, TURN relay and Caddy.
# Run ./install.sh from the repository root (it writes infra/compose/.env and starts this file).
#   docker compose -f infra/compose/docker-compose.yml --env-file infra/compose/.env up -d
# Optional profiles: s3 (SeaweedFS object storage), monitoring (Prometheus, Grafana),
# web (the Flutter web app), images (build-only computer images), search (SearXNG web search).
name: casama

x-casama: &casama
  image: ${CASAMA_REGISTRY:-casama}/server:${CASAMA_VERSION:-local}
  build:
    context: ../..
    dockerfile: apps/server/Dockerfile
  restart: unless-stopped
  networks: [internal]
  environment: &casama-env
    NODE_ENV: production
    DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    SUPABASE_URL: ${CASAMA_PUBLIC_URL}
    SUPABASE_ANON_KEY: ${ANON_KEY}
    SUPABASE_JWT_SECRET: ${JWT_SECRET}
    PUBLIC_APP_URL: ${CASAMA_PUBLIC_URL}
    PUBLIC_API_URL: ${CASAMA_PUBLIC_URL}
    # Pages (D-119) live on their own origin: a separate domain, or another port for trials.
    PAGES_URL: ${CASAMA_PAGES_URL:-http://localhost:8790}
    SUPERVISOR_URL: http://casama-supervisor:8788
    SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
    INTERNAL_TOKEN: ${INTERNAL_TOKEN}
    API_INTERNAL_URL: http://api:8787
    TURN_SECRET: ${TURN_SECRET}
    TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST}
    METRICS_TOKEN: ${METRICS_TOKEN}
    TELEMETRY: ${TELEMETRY:-off}
    INSTANCE_ADMIN_EMAILS: ${INSTANCE_ADMIN_EMAILS:-}
    RESEND_API_KEY: ${RESEND_API_KEY:-}
    EMAIL_FROM: ${EMAIL_FROM:-Casama <no-reply@localhost>}
    # Invites use the same SMTP server as Auth when there's no Resend key (D-174).
    SMTP_HOST: ${SMTP_HOST:-}
    SMTP_PORT: ${SMTP_PORT:-587}
    SMTP_USER: ${SMTP_USER:-}
    SMTP_PASS: ${SMTP_PASS:-}
    ERROR_REPORTING: ${ERROR_REPORTING:-auto}
    SENTRY_DSN: ${SENTRY_DSN:-}
    POSTHOG_API_KEY: ${POSTHOG_API_KEY:-}
    CASAMA_CLOUD_URL: ${CASAMA_CLOUD_URL:-}
    CASAMA_CLOUD_KEY: ${CASAMA_CLOUD_KEY:-}
    CASAMA_LICENSE_KEY: ${CASAMA_LICENSE_KEY:-}
    CHATGPT_SIGN_IN: ${CHATGPT_SIGN_IN:-auto}
    ABUSE_CONTROLS: ${ABUSE_CONTROLS:-auto}
    SUPABASE_SERVICE_ROLE_KEY: ${SERVICE_ROLE_KEY}
    # Plans and payments (Phase 7): off for self-hosting; Casama Cloud turns it on (D-197).
    BILLING_ENABLED: ${BILLING_ENABLED:-false}
    DODO_API_KEY: ${DODO_API_KEY:-}
    DODO_WEBHOOK_SECRET: ${DODO_WEBHOOK_SECRET:-}
    DODO_ENVIRONMENT: ${DODO_ENVIRONMENT:-}
    APP_STORE_ISSUER_ID: ${APP_STORE_ISSUER_ID:-}
    APP_STORE_KEY_ID: ${APP_STORE_KEY_ID:-}
    APP_STORE_PRIVATE_KEY: ${APP_STORE_PRIVATE_KEY:-}
    APP_STORE_BUNDLE_ID: ${APP_STORE_BUNDLE_ID:-}
    APP_STORE_ENVIRONMENT: ${APP_STORE_ENVIRONMENT:-}
    GOOGLE_PLAY_PACKAGE_NAME: ${GOOGLE_PLAY_PACKAGE_NAME:-}
    GOOGLE_PLAY_SERVICE_ACCOUNT: ${GOOGLE_PLAY_SERVICE_ACCOUNT:-}
    GOOGLE_PLAY_RTDN_TOKEN: ${GOOGLE_PLAY_RTDN_TOKEN:-}
    GOOGLE_PLAY_RTDN_AUDIENCE: ${GOOGLE_PLAY_RTDN_AUDIENCE:-}
    GOOGLE_PLAY_RTDN_EMAIL: ${GOOGLE_PLAY_RTDN_EMAIL:-}
    CLOUD_CONNECT: ${CLOUD_CONNECT:-}
    CLOUD_MODEL_UPSTREAM_URL: ${CLOUD_MODEL_UPSTREAM_URL:-}
    CLOUD_MODEL_UPSTREAM_KEY: ${CLOUD_MODEL_UPSTREAM_KEY:-}
    CLOUD_MODEL_MARKUP: ${CLOUD_MODEL_MARKUP:-}
    CLOUD_COMPUTER_USD_PER_HOUR: ${CLOUD_COMPUTER_USD_PER_HOUR:-}
    COMPUTER_RATES: ${COMPUTER_RATES:-}
    # Abuse controls (D-094): sign-up proofs, App Check project, OAuth redirect for app connections.
    SIGNUP_PROOFS: ${SIGNUP_PROOFS:-}
    SIGNUP_POW_DIFFICULTY: ${SIGNUP_POW_DIFFICULTY:-}
    APP_CHECK_PROJECT_NUMBER: ${APP_CHECK_PROJECT_NUMBER:-}
    OAUTH_REDIRECT_URL: ${OAUTH_REDIRECT_URL:-}
    PHONE_CALLS: ${PHONE_CALLS:-}
    APNS_VOIP_TOPIC: ${APNS_VOIP_TOPIC:-}
    POSTHOG_HOST: ${POSTHOG_HOST:-}
    LOG_LEVEL: ${LOG_LEVEL:-}
    # Shared by the API and the worker: encryption at rest (D-136) and the sign-up hook (D-145).
    CONTENT_ENCRYPTION_KEY: ${CONTENT_ENCRYPTION_KEY:-}
    CONTENT_ENCRYPTION_KEY_PREVIOUS: ${CONTENT_ENCRYPTION_KEY_PREVIOUS:-}
    CONTENT_KMS_KEY_ID: ${CONTENT_KMS_KEY_ID:-}
    CONTENT_KMS_REGION: ${CONTENT_KMS_REGION:-}
    SIGNUP_ALLOWED_EMAILS: ${SIGNUP_ALLOWED_EMAILS:-}
    AUTH_HOOK_SECRET: ${AUTH_HOOK_SECRET:-}
    # Optional settings (empty = not set); see docs-site/self-hosting/configuration.md (audit 2026-11: these were read by
    # the server but never passed through).
    ACCOUNT_DELETION_GRACE_DAYS: ${ACCOUNT_DELETION_GRACE_DAYS:-}
    TELEMETRY_URL: ${TELEMETRY_URL:-}
    AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID:-}
    AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY:-}
    AWS_SESSION_TOKEN: ${AWS_SESSION_TOKEN:-}
    OUTBOUND_ALLOW_CIDRS: ${OUTBOUND_ALLOW_CIDRS:-}
    HEALTH_REQUIRES_ENCRYPTION: ${HEALTH_REQUIRES_ENCRYPTION:-}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    RATE_LIMIT_PER_MINUTE: ${RATE_LIMIT_PER_MINUTE:-}
    GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
    GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
    MCP_OAUTH_CLIENTS: ${MCP_OAUTH_CLIENTS:-}
    COMPOSIO_API_KEY: ${COMPOSIO_API_KEY:-}
    UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    GALLERY_URL: ${GALLERY_URL:-https://gallery.casama.ai}
    TREG_API_KEY: ${TREG_API_KEY:-}
    DEFAULT_MODEL_OPENROUTER: ${DEFAULT_MODEL_OPENROUTER:-}
    DEFAULT_MODEL_OPENAI: ${DEFAULT_MODEL_OPENAI:-}
    # Live calls for workspaces without their own key (D-177).
    GOOGLE_AI_API_KEY: ${GOOGLE_AI_API_KEY:-}
    DEFAULT_REASONING_EFFORT: ${DEFAULT_REASONING_EFFORT:-}
    LAZY_TOOLS_THRESHOLD: ${LAZY_TOOLS_THRESHOLD:-}
    LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-}
    LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
    LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-}
    UPDATE_CHECK_URL: ${UPDATE_CHECK_URL:-}

services:
  # ---------------------------------------------------------------- Supabase
  db:
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    restart: unless-stopped
    networks: [internal]
    command:
      [
        "postgres",
        "-c",
        "config_file=/etc/postgresql/postgresql.conf",
        "-c",
        "log_min_messages=fatal",
      ]
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: 5432
      POSTGRES_PORT: 5432
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      POSTGRES_DB: postgres
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: 3600
    volumes:
      - ./selfhost/db/realtime.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:ro
      - ./selfhost/db/roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:ro
      - ./selfhost/db/jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:ro
      - db-data:/var/lib/postgresql/data
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 30

  auth:
    image: public.ecr.aws/supabase/gotrue:v2.197.0
    restart: unless-stopped
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${CASAMA_PUBLIC_URL}
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres
      GOTRUE_SITE_URL: ${CASAMA_PUBLIC_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS:-casama://app/login-callback}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP:-false}
      # Casama's sign-up hook (abuse controls, D-094; the sign-up allowlist, D-145). Turn it on with
      # SIGNUP_HOOK_ENABLED=true and the same AUTH_HOOK_SECRET ("v1,whsec_…") here and on the API.
      # Supabase Auth only calls https hooks (plain http only on localhost), so the hook goes through
      # the public address: install.sh sets SIGNUP_HOOK_URI to https://<domain>/hooks/auth/before-user-created.
      # An http URL here (even with the hook off) stops Auth from starting.
      GOTRUE_HOOK_BEFORE_USER_CREATED_ENABLED: ${SIGNUP_HOOK_ENABLED:-false}
      GOTRUE_HOOK_BEFORE_USER_CREATED_URI: ${SIGNUP_HOOK_URI:-}
      GOTRUE_HOOK_BEFORE_USER_CREATED_SECRETS: ${AUTH_HOOK_SECRET:-}
      # Two-step sign-in with authenticator apps (D-093).
      GOTRUE_MFA_TOTP_ENROLL_ENABLED: "true"
      GOTRUE_MFA_TOTP_VERIFY_ENABLED: "true"
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: "true"
      # Continue with Apple and Google. Off until the credentials are set (see
      # docs-site/self-hosting/configuration.md). Apple's client id list is the Services ID first,
      # then the app id ai.casama.app. The callback is the public /auth/v1/callback Kong serves;
      # GoTrue's own default would be the site root, which Kong does not route.
      GOTRUE_EXTERNAL_APPLE_ENABLED: ${APPLE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_APPLE_CLIENT_ID: ${APPLE_AUTH_CLIENT_IDS:-}
      GOTRUE_EXTERNAL_APPLE_SECRET: ${APPLE_AUTH_SECRET:-}
      GOTRUE_EXTERNAL_APPLE_REDIRECT_URI: ${CASAMA_PUBLIC_URL}/auth/v1/callback
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_AUTH_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_AUTH_CLIENT_ID:-}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_AUTH_SECRET:-}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${CASAMA_PUBLIC_URL}/auth/v1/callback
      GOTRUE_MAILER_AUTOCONFIRM: ${EMAIL_AUTOCONFIRM:-true}
      # Casama's branded emails (supabase/templates, built by apps/server/scripts/build-email-templates.ts),
      # fetched from Caddy's internal-only :8081. Override a URL to use your own.
      GOTRUE_MAILER_TEMPLATES_MAGIC_LINK: ${EMAIL_TEMPLATE_MAGIC_LINK:-http://caddy:8081/magic_link.html}
      GOTRUE_MAILER_TEMPLATES_CONFIRMATION: ${EMAIL_TEMPLATE_CONFIRMATION:-http://caddy:8081/confirmation.html}
      GOTRUE_MAILER_TEMPLATES_INVITE: ${EMAIL_TEMPLATE_INVITE:-http://caddy:8081/invite.html}
      GOTRUE_MAILER_TEMPLATES_RECOVERY: ${EMAIL_TEMPLATE_RECOVERY:-http://caddy:8081/recovery.html}
      GOTRUE_MAILER_TEMPLATES_EMAIL_CHANGE: ${EMAIL_TEMPLATE_EMAIL_CHANGE:-http://caddy:8081/email_change.html}
      GOTRUE_MAILER_TEMPLATES_REAUTHENTICATION: ${EMAIL_TEMPLATE_REAUTHENTICATION:-http://caddy:8081/reauthentication.html}
      GOTRUE_MAILER_SUBJECTS_MAGIC_LINK: Your Casama sign-in link
      GOTRUE_MAILER_SUBJECTS_CONFIRMATION: Confirm your Casama account
      GOTRUE_MAILER_SUBJECTS_INVITE: You're invited to Casama
      GOTRUE_MAILER_SUBJECTS_RECOVERY: Reset your Casama password
      GOTRUE_MAILER_SUBJECTS_EMAIL_CHANGE: Confirm your new email for Casama
      GOTRUE_MAILER_SUBJECTS_REAUTHENTICATION: Your Casama security code
      GOTRUE_SMTP_HOST: ${SMTP_HOST:-}
      GOTRUE_SMTP_PORT: ${SMTP_PORT:-587}
      GOTRUE_SMTP_USER: ${SMTP_USER:-}
      GOTRUE_SMTP_PASS: ${SMTP_PASS:-}
      GOTRUE_SMTP_ADMIN_EMAIL: ${SMTP_ADMIN_EMAIL:-}
      # Passkeys (D-183), off until set. In the browser they work under your own domain:
      # PASSKEY_RP_ID is that domain without https://, PASSKEY_RP_ORIGINS the addresses the web
      # app is served from. The store apps only use passkeys made for casama.ai.
      GOTRUE_PASSKEY_ENABLED: ${PASSKEYS_ENABLED:-false}
      GOTRUE_WEBAUTHN_RP_DISPLAY_NAME: Casama
      GOTRUE_WEBAUTHN_RP_ID: ${PASSKEY_RP_ID:-}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${PASSKEY_RP_ORIGINS:-${CASAMA_PUBLIC_URL}}
      # SAML SSO (enterprise, ee/): workspaces register their identity provider through the API.
      GOTRUE_SAML_ENABLED: ${SAML_ENABLED:-true}
      GOTRUE_SAML_PRIVATE_KEY: ${SAML_PRIVATE_KEY}

  rest:
    image: public.ecr.aws/supabase/postgrest:v16.5
    restart: unless-stopped
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    command: ["postgrest"]
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: "false"

  realtime:
    # The tenant id comes from this name (realtime-dev); keep it.
    container_name: realtime-dev.supabase-realtime
    image: public.ecr.aws/supabase/realtime:v2.151.3
    restart: unless-stopped
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    environment:
      PORT: 4000
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: postgres
      DB_AFTER_CONNECT_QUERY: SET search_path TO _realtime
      DB_ENC_KEY: ${REALTIME_ENC_KEY}
      API_JWT_SECRET: ${JWT_SECRET}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"

  kong:
    image: public.ecr.aws/supabase/kong:2.8.1
    restart: unless-stopped
    networks: [internal]
    depends_on: [auth, rest, realtime]
    entrypoint: bash -c 'eval "echo \"$$(cat ~/temp.yml)\"" > ~/kong.yml && /docker-entrypoint.sh kong docker-start'
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
    volumes:
      - ./selfhost/kong.yml:/home/kong/temp.yml:ro

  # ---------------------------------------------------------------- Casama
  migrate:
    image: public.ecr.aws/supabase/postgres:17.11.0.011
    networks: [internal]
    depends_on: { db: { condition: service_healthy } }
    entrypoint: ["/bin/sh", "/migrate.sh"]
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      WORKER_DB_PASSWORD: ${WORKER_DB_PASSWORD:-}
    volumes:
      - ./selfhost/migrate.sh:/migrate.sh:ro
      - ../../supabase/migrations:/migrations:ro
    restart: "no"

  api:
    <<: *casama
    environment:
      <<: *casama-env
      MODE: api
      PAGES_PORT: "8790"
    depends_on: { migrate: { condition: service_completed_successfully } }

  worker:
    <<: *casama
    environment:
      <<: *casama-env
      MODE: worker
      RUN_CONCURRENCY: ${RUN_CONCURRENCY:-20}
      # Least-privilege database role (D-095); empty falls back to DATABASE_URL.
      WORKER_DATABASE_URL: ${WORKER_DB_PASSWORD:+postgres://casama_worker:${WORKER_DB_PASSWORD}@db:5432/postgres}
      # Push notifications: the Firebase service account JSON on one line (optional).
      FCM_SERVICE_ACCOUNT: ${FCM_SERVICE_ACCOUNT:-}
      APNS_KEY_P8: ${APNS_KEY_P8:-}
      APNS_KEY_ID: ${APNS_KEY_ID:-}
      APNS_TEAM_ID: ${APNS_TEAM_ID:-}
      AI_GATEWAY_URL: ${AI_GATEWAY_URL:-}
      AI_GATEWAY_TOKEN: ${AI_GATEWAY_TOKEN:-}
      # Web search without a workspace key (D-179): http://searxng:8080 with the search profile.
      SEARXNG_URL: ${SEARXNG_URL:-}
    depends_on: { migrate: { condition: service_completed_successfully } }
    # The worker serves no HTTP, so the image's /healthz check would always fail here.
    healthcheck: { disable: true }

  # The only service with Docker access. It joins each computer's private network to reach computerd.
  supervisor:
    image: ${CASAMA_REGISTRY:-casama}/supervisor:${CASAMA_VERSION:-local}
    build:
      context: ../..
      dockerfile: apps/supervisor/Dockerfile
    container_name: casama-supervisor
    restart: unless-stopped
    networks: [internal]
    environment:
      SUPERVISOR_TOKEN: ${SUPERVISOR_TOKEN}
      COMPUTER_TOKEN_SECRET: ${COMPUTER_TOKEN_SECRET}
      EGRESS_CONTAINER: casama-egress
      EGRESS_CONTROL_URL: http://casama-egress:3129
      EGRESS_CONTROL_TOKEN: ${EGRESS_CONTROL_TOKEN}
      SUPERVISOR_CONTAINER: casama-supervisor
      COMPUTER_IMAGE_HEADLESS: ${CASAMA_REGISTRY:-casama}/computer-headless:${CASAMA_VERSION:-local}
      COMPUTER_IMAGE_DESKTOP: ${CASAMA_REGISTRY:-casama}/computer-desktop:${CASAMA_VERSION:-local}
      COMPUTER_MEMORY_MB: ${COMPUTER_MEMORY_MB:-2048}
      WARM_POOL_SIZE: ${WARM_POOL_SIZE:-0}
      OBJECT_STORE_DIR: /data/objects
      TURN_CONTAINER: casama-turn
      TURN_SECRET: ${TURN_SECRET}
      TURN_PUBLIC_HOST: ${TURN_PUBLIC_HOST}
      SANDBOX_RUNTIME: ${SANDBOX_RUNTIME:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - objects:/data/objects

  # The only route from computers to the internet; blocks private and metadata addresses.
  egress:
    image: ${CASAMA_REGISTRY:-casama}/egress-proxy:${CASAMA_VERSION:-local}
    build:
      context: ../..
      dockerfile: infra/egress-proxy/Dockerfile
    container_name: casama-egress
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      EGRESS_CONTROL_TOKEN: ${EGRESS_CONTROL_TOKEN}
      # Abuse controls (D-094; Casama Cloud): refuse mail and mining traffic and report it to the API.
      EGRESS_ABUSE: ${EGRESS_ABUSE:-off}
      EGRESS_ABUSE_URL: http://api:8787/internal/abuse
      EGRESS_ABUSE_TOKEN: ${INTERNAL_TOKEN}

  # TURN relay for live view (D-055). Production also wants TLS on 5349 (turns:).
  turn:
    image: ${CASAMA_REGISTRY:-casama}/turn:${CASAMA_VERSION:-local}
    build:
      context: ../..
      dockerfile: infra/turn/Dockerfile
    container_name: casama-turn
    restart: unless-stopped
    networks: [internal]
    environment:
      TURN_SECRET: ${TURN_SECRET}
    ports:
      - "3478:3478/udp"
      - "3478:3478/tcp"

  # Daily off-site backups (D-197, profile "backup"): the database, the .env (only age-encrypted)
  # and optionally computer archives, to any S3-compatible bucket. install.sh --backups turns it on.
  # Run one now: docker compose ... --profile backup run --rm backup now
  backup:
    image: ${CASAMA_REGISTRY:-casama}/backup:${CASAMA_VERSION:-local}
    build:
      context: ../..
      dockerfile: infra/backup/Dockerfile
    container_name: casama-backup
    profiles: [backup]
    restart: unless-stopped
    networks: [internal, egress]
    depends_on: [db]
    environment:
      PGHOST: db
      PGUSER: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: postgres
      BACKUP_TIME: ${BACKUP_TIME:-03:30}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-30}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-auto}
      BACKUP_S3_ACCESS_KEY_ID: ${BACKUP_S3_ACCESS_KEY_ID:-}
      BACKUP_S3_SECRET_ACCESS_KEY: ${BACKUP_S3_SECRET_ACCESS_KEY:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-casama}
      BACKUP_AGE_RECIPIENTS: ${BACKUP_AGE_RECIPIENTS:-}
      BACKUP_OBJECTS: ${BACKUP_OBJECTS:-false}
      BACKUP_PING_URL: ${BACKUP_PING_URL:-}
    volumes:
      - backups:/backups
      - objects:/objects:ro
      - ./.env:/env:ro

  # Free web search for bots (D-179, profile "search"). Set SEARXNG_URL=http://searxng:8080 too.
  # Internal only: no published port; it needs outbound internet to ask the search engines.
  searxng:
    image: searxng/searxng:2026.10.29-c15647b5a
    profiles: [search]
    restart: unless-stopped
    networks: [internal, egress]
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-}
    volumes:
      - ./selfhost/searxng/settings.yml:/etc/searxng/settings.yml:ro
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]

  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    networks: [internal]
    depends_on: [api, kong]
    environment:
      CASAMA_SITE: ${CASAMA_SITE}
      CASAMA_PAGES_SITE: ${CASAMA_PAGES_SITE:-:8790}
    ports:
      - "${HTTP_BIND:-0.0.0.0}:${HTTP_PORT:-80}:80"
      - "${HTTP_BIND:-0.0.0.0}:${HTTPS_PORT:-443}:443"
      # Pages follow HTTP_BIND too: behind a tunnel they stay on loopback (Docker skips ufw).
      - "${HTTP_BIND:-0.0.0.0}:${PAGES_PORT:-8790}:8790"
    volumes:
      - ./selfhost/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      # Casama's branded auth emails, served to Supabase Auth on the internal network only.
      - ../../supabase/templates:/srv/email-templates:ro

  # ---------------------------------------------------------------- optional
  web:
    image: ${CASAMA_REGISTRY:-casama}/web:${CASAMA_VERSION:-local}
    profiles: [web]
    build:
      context: ../..
      dockerfile: client/Dockerfile.web
    restart: unless-stopped
    networks: [internal]

  s3:
    image: chrislusf/seaweedfs:4.53
    container_name: casama-s3
    profiles: [s3]
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        printf '{"identities":[{"name":"casama","credentials":[{"accessKey":"%s","secretKey":"%s"}],"actions":["Read","Write","List","Admin"]}]}'
        "$$S3_ACCESS_KEY_ID" "$$S3_SECRET_ACCESS_KEY" > /tmp/s3.json
        && exec weed server -s3 -s3.config=/tmp/s3.json -dir=/data
    environment:
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-}
    volumes:
      - s3data:/data
    networks: [internal]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    restart: unless-stopped
    networks: [internal]
    entrypoint:
      [
        "/bin/sh",
        "-c",
        'printf ''%s'' "$$METRICS_TOKEN" > /tmp/metrics_token && exec /bin/prometheus --config.file=/etc/prometheus/prometheus.yml --storage.tsdb.retention.time=30d',
      ]
    environment:
      METRICS_TOKEN: ${METRICS_TOKEN}
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus

  node-exporter:
    image: prom/node-exporter:v1.9.1
    profiles: [monitoring]
    restart: unless-stopped
    networks: [internal]
    command: ["--path.rootfs=/host"]
    volumes:
      - /:/host:ro,rslave

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    restart: unless-stopped
    networks: [internal]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "127.0.0.1:3001:3000"
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Build-only services so `compose --profile images build` builds the computer images.
  computer-headless:
    build:
      context: ../..
      dockerfile: infra/images/computer/Dockerfile.headless
    image: ${CASAMA_REGISTRY:-casama}/computer-headless:${CASAMA_VERSION:-local}
    profiles: [images]

  computer-desktop:
    build:
      context: ../..
      dockerfile: infra/images/computer/Dockerfile.desktop
      args:
        BASE: ${CASAMA_REGISTRY:-casama}/computer-headless:${CASAMA_VERSION:-local}
    image: ${CASAMA_REGISTRY:-casama}/computer-desktop:${CASAMA_VERSION:-local}
    profiles: [images]

networks:
  internal: {}
  egress: {}

volumes:
  db-data: {}
  db-config: {}
  objects: {}
  backups: {}
  caddy-data: {}
  s3data: {}
  prometheus-data: {}
  grafana-data: {}
