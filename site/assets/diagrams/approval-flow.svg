<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><style>
.bg{fill:#ffffff}.ink{fill:#24112f}.mut{fill:#5b4a6b}.box{fill:#ece8fb;stroke:#6b4fd8;stroke-width:2}.plain{fill:#f6f4fb;stroke:#c9c2dd;stroke-width:2}.acc{fill:#6b4fd8}.onacc{fill:#ffffff}.cy{fill:#d9f2f8;stroke:#5cc8e0;stroke-width:2}.ln{stroke:#6b4fd8;stroke-width:3;fill:none}.ah{fill:#6b4fd8}.div{stroke:#c9c2dd;stroke-width:2;stroke-dasharray:6 6}
text{font-family:"Google Sans",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1f1d24}.ink{fill:#f2eef9}.mut{fill:#b9b0c9}.box{fill:#2c2836;stroke:#9a85f0}.plain{fill:#2c2836;stroke:#4a4458}.acc{fill:#9a85f0}.onacc{fill:#1f1d24}.cy{fill:#1f3a42;stroke:#5cc8e0}.ln{stroke:#9a85f0}.ah{fill:#9a85f0}.div{stroke:#4a4458}}
</style>
<rect class="bg" width="960" height="540"/>
<text class="ink" x="480" y="62" text-anchor="middle" font-size="26" font-weight="700">How an approval works in Casama</text>
<g font-size="20" text-anchor="middle">
<rect class="box" x="40" y="170" width="190" height="90" rx="16"/><text class="ink" x="135" y="222">Bot works</text>
<path class="ln" d="M232 215H274"/><path class="ah" d="M270 207l12 8-12 8z"/>
<rect class="box" x="284" y="170" width="190" height="90" rx="16"/><text class="ink" x="379" y="206">Reaches a risky</text><text class="ink" x="379" y="232">step</text>
<path class="ln" d="M476 215H518"/><path class="ah" d="M514 207l12 8-12 8z"/>
<rect class="box" x="528" y="170" width="190" height="90" rx="16"/><text class="ink" x="623" y="206">Pauses and</text><text class="ink" x="623" y="232">asks you</text>
<path class="ln" d="M720 215H762V140H774"/><path class="ah" d="M770 132l12 8-12 8z"/>
<path class="ln" d="M720 215H762V300H774"/><path class="ah" d="M770 292l12 8-12 8z"/>
<rect class="acc" x="784" y="100" width="140" height="80" rx="16"/><text class="onacc" x="854" y="136" font-weight="700">Approve</text><text class="onacc" x="854" y="162" font-size="17">Carries on</text>
<rect class="plain" x="784" y="260" width="140" height="80" rx="16"/><text class="ink" x="854" y="296" font-weight="700">Deny</text><text class="mut" x="854" y="322" font-size="17">Step doesn't run</text>
<text class="mut" x="379" y="296" font-size="17">send, pay, delete, publish</text>
<text class="mut" x="623" y="296" font-size="17">Waiting costs nothing.</text>
<text class="mut" x="623" y="318" font-size="17">No answer in 24 hours</text>
<text class="mut" x="623" y="340" font-size="17">counts as a deny</text>
<rect class="cy" x="40" y="400" width="880" height="80" rx="16"/>
<text class="ink" x="480" y="434" font-weight="700" font-size="19">Before a destructive command, a checkpoint is saved</text>
<text class="mut" x="480" y="460" font-size="17">So you can watch the computer, restore it, and see every step on the run's timeline</text>
</g>
</svg>
