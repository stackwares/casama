<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img"><style>
.bg{fill:#ffffff}.ink{fill:#24112f}.mut{fill:#5b4a6b}.box{fill:#ece8fb;stroke:#6b4fd8;stroke-width:2}.plain{fill:#f6f4fb;stroke:#c9c2dd;stroke-width:2}.acc{fill:#6b4fd8}.onacc{fill:#ffffff}.cy{fill:#d9f2f8;stroke:#5cc8e0;stroke-width:2}.ln{stroke:#6b4fd8;stroke-width:3;fill:none}.ah{fill:#6b4fd8}.div{stroke:#c9c2dd;stroke-width:2;stroke-dasharray:6 6}
text{font-family:"Google Sans",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme: dark){.bg{fill:#1f1d24}.ink{fill:#f2eef9}.mut{fill:#b9b0c9}.box{fill:#2c2836;stroke:#9a85f0}.plain{fill:#2c2836;stroke:#4a4458}.acc{fill:#9a85f0}.onacc{fill:#1f1d24}.cy{fill:#1f3a42;stroke:#5cc8e0}.ln{stroke:#9a85f0}.ah{fill:#9a85f0}.div{stroke:#4a4458}}
</style>
<rect class="bg" width="960" height="540"/>
<text class="ink" x="480" y="62" text-anchor="middle" font-size="26" font-weight="700">How an AI agent works</text>
<g font-size="20" text-anchor="middle">
<rect class="box" x="40" y="150" width="130" height="80" rx="16"/><text class="ink" x="105" y="196">Goal</text>
<path class="ln" d="M172 190H208"/><path class="ah" d="M204 182l12 8-12 8z"/>
<rect class="plain" x="220" y="110" width="700" height="250" rx="22"/>
<text class="mut" x="570" y="142" font-size="16" letter-spacing="1.5">THE LOOP: ONE PASS IS ONE STEP</text>
<rect class="box" x="244" y="162" width="170" height="90" rx="16"/><text class="ink" x="329" y="203">Plan</text><text class="mut" x="329" y="228" font-size="16">pick one step</text>
<path class="ln" d="M416 207H446"/><path class="ah" d="M442 199l12 8-12 8z"/>
<rect class="box" x="458" y="162" width="210" height="90" rx="16"/><text class="ink" x="563" y="203">Act</text><text class="mut" x="563" y="228" font-size="16">use tools on its computer</text>
<path class="ln" d="M670 207H700"/><path class="ah" d="M696 199l12 8-12 8z"/>
<rect class="box" x="712" y="162" width="184" height="90" rx="16"/><text class="ink" x="804" y="203">Check</text><text class="mut" x="804" y="228" font-size="16">read the result</text>
<path class="ln" d="M804 254V300H329V268"/><path class="ah" d="M321 272h16l-8-12z"/>
<text class="mut" x="566" y="326" font-size="17">Not done yet: go round again</text>
<path class="ln" d="M570 362V388"/><path class="ah" d="M562 384h16l-8 12z"/>
<rect class="acc" x="330" y="404" width="190" height="70" rx="16"/><text class="onacc" x="425" y="445" font-weight="700">Done</text>
<rect class="cy" x="560" y="404" width="230" height="70" rx="16"/><text class="ink" x="675" y="445" font-weight="700">Ask you</text>
<text class="mut" x="425" y="498" font-size="16">the task is finished</text>
<text class="mut" x="675" y="498" font-size="16">it needs a decision or approval</text>
</g>
</svg>
