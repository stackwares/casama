# Casama on Dokploy. Every secret that install.sh generates is generated here, except the SAML
# signing key (an RSA key, which Dokploy's helpers cannot make): SAML SSO starts off. See README.md.

[variables]
main_domain = "${domain}"
pages_domain = "${domain}"
postgres_password = "${password:32}"
worker_db_password = "${password:32}"
jwt_secret = "${password:64}"
# The Supabase keys: JWTs signed with jwt_secret, as install.sh makes them (role, iss, iat, exp).
anon_key_payload = """{
  "role": "anon",
  "iss": "supabase",
  "exp": ${timestamps:2036-11-01T00:00:00Z}
}
"""
service_role_key_payload = """{
  "role": "service_role",
  "iss": "supabase",
  "exp": ${timestamps:2036-11-01T00:00:00Z}
}
"""
anon_key = "${jwt:jwt_secret:anon_key_payload}"
service_role_key = "${jwt:jwt_secret:service_role_key_payload}"
secret_key_base = "${password:64}"
# Realtime needs exactly 16 characters (hash gives one hex character per unit of length).
realtime_enc_key = "${hash:16}"
supervisor_token = "${password:48}"
computer_token_secret = "${password:64}"
egress_control_token = "${password:48}"
internal_token = "${password:48}"
turn_secret = "${password:48}"
metrics_token = "${password:48}"
# base64:32 is 32 random bytes, base64-encoded: the shape both of these need.
auth_hook_secret = "v1,whsec_${base64:32}"
content_encryption_key = "${base64:32}"

[[config.domains]]
serviceName = "caddy"
port = 80
host = "${main_domain}"

# Pages (bots' web pages) get their own address, served by the API on port 8790.
[[config.domains]]
serviceName = "api"
port = 8790
host = "${pages_domain}"

[config]
env = [
  "# The public address. Change these together when you move to your own domain with HTTPS.",
  "CASAMA_PUBLIC_URL=http://${main_domain}",
  "CASAMA_PAGES_URL=http://${pages_domain}",
  "# A name or IP that reaches this server directly, for live view (UDP and TCP 3478).",
  "TURN_PUBLIC_HOST=${main_domain}",
  "# With an https address: https://<domain>/hooks/auth/before-user-created. Never an http address.",
  "SIGNUP_HOOK_URI=",
  "",
  "# Generated secrets. Keep a copy: they hold every key for this installation.",
  "POSTGRES_PASSWORD=${postgres_password}",
  "WORKER_DB_PASSWORD=${worker_db_password}",
  "JWT_SECRET=${jwt_secret}",
  "ANON_KEY=${anon_key}",
  "SERVICE_ROLE_KEY=${service_role_key}",
  "SECRET_KEY_BASE=${secret_key_base}",
  "REALTIME_ENC_KEY=${realtime_enc_key}",
  "SUPERVISOR_TOKEN=${supervisor_token}",
  "COMPUTER_TOKEN_SECRET=${computer_token_secret}",
  "EGRESS_CONTROL_TOKEN=${egress_control_token}",
  "INTERNAL_TOKEN=${internal_token}",
  "TURN_SECRET=${turn_secret}",
  "METRICS_TOKEN=${metrics_token}",
  "AUTH_HOOK_SECRET=${auth_hook_secret}",
  "CONTENT_ENCRYPTION_KEY=${content_encryption_key}",
  "",
  "# Optional. See https://docs.casama.ai/self-hosting/configuration",
  "CASAMA_VERSION=latest",
  "COMPUTER_HOST_MEMORY_GB=4",
  "SANDBOX_RUNTIME=",
  "INSTANCE_ADMIN_EMAILS=",
  "EMAIL_AUTOCONFIRM=true",
  "DISABLE_SIGNUP=false",
  "SMTP_HOST=",
  "SMTP_PORT=587",
  "SMTP_USER=",
  "SMTP_PASS=",
  "SMTP_ADMIN_EMAIL=",
  "SAML_ENABLED=false",
  "SAML_PRIVATE_KEY=",
]

[[config.mounts]]
filePath = "/volumes/db/realtime.sql"
content = '''
\set pguser `echo "$POSTGRES_USER"`
create schema if not exists _realtime;
alter schema _realtime owner to :pguser;
'''

[[config.mounts]]
filePath = "/volumes/db/roles.sql"
content = '''
-- Passwords for the Supabase service roles (the image creates the roles).
\set pgpass `echo "$POSTGRES_PASSWORD"`
ALTER USER authenticator WITH PASSWORD :'pgpass';
ALTER USER pgbouncer WITH PASSWORD :'pgpass';
ALTER USER supabase_auth_admin WITH PASSWORD :'pgpass';
ALTER USER supabase_storage_admin WITH PASSWORD :'pgpass';
'''

[[config.mounts]]
filePath = "/volumes/db/jwt.sql"
content = '''
\set jwt_secret `echo "$JWT_SECRET"`
\set jwt_exp `echo "$JWT_EXP"`
ALTER DATABASE postgres SET "app.settings.jwt_secret" TO :'jwt_secret';
ALTER DATABASE postgres SET "app.settings.jwt_exp" TO :'jwt_exp';
'''

[[config.mounts]]
filePath = "/volumes/kong/kong.yml"
content = '''
# infra/compose/selfhost/kong.yml, with Realtime at its service name here.
_format_version: '2.1'
_transform: true
consumers:
  - username: anon
    keyauth_credentials:
      - key: $SUPABASE_ANON_KEY
  - username: service_role
    keyauth_credentials:
      - key: $SUPABASE_SERVICE_KEY
acls:
  - consumer: anon
    group: anon
  - consumer: service_role
    group: admin
services:
  - name: auth-v1-open
    url: http://auth:9999/verify
    routes: [{ name: auth-v1-open, strip_path: true, paths: [/auth/v1/verify] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-callback
    url: http://auth:9999/callback
    routes: [{ name: auth-v1-open-callback, strip_path: true, paths: [/auth/v1/callback] }]
    plugins: [{ name: cors }]
  - name: auth-v1-open-authorize
    url: http://auth:9999/authorize
    routes: [{ name: auth-v1-open-authorize, strip_path: true, paths: [/auth/v1/authorize] }]
    plugins: [{ name: cors }]
  - name: auth-v1
    url: http://auth:9999/
    routes: [{ name: auth-v1-all, strip_path: true, paths: [/auth/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
  - name: rest-v1
    url: http://rest:3000/
    routes: [{ name: rest-v1-all, strip_path: true, paths: [/rest/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: true }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
  - name: realtime-v1-ws
    url: http://realtime-dev:4000/socket
    protocol: ws
    routes: [{ name: realtime-v1-ws, strip_path: true, paths: [/realtime/v1/] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
  - name: realtime-v1-rest
    url: http://realtime-dev:4000/api
    protocol: http
    routes: [{ name: realtime-v1-rest, strip_path: true, paths: [/realtime/v1/api] }]
    plugins:
      - name: cors
      - name: key-auth
        config: { hide_credentials: false }
      - name: acl
        config: { hide_groups_header: true, allow: [admin, anon] }
'''

[[config.mounts]]
filePath = "/volumes/migrate/migrate.sh"
content = '''
#!/bin/sh
# One-shot: waits for Supabase Auth and Realtime to create their schemas, then applies Casama's
# migrations in order, once each (tracked in casama_migrations). Safe to re-run on upgrades.
set -eu
export PGPASSWORD="$POSTGRES_PASSWORD"
PSQL="psql -h db -U supabase_admin -d postgres -v ON_ERROR_STOP=1 -qtA"
for i in $(seq 1 120); do
  # The Postgres image ships a minimal auth.users, so wait for objects only Supabase Auth's own
  # migrations create (the MFA tables and email_confirmed_at), not just the table.
  if $PSQL -c "select to_regclass('auth.mfa_factors') is not null and to_regclass('auth.flow_state') is not null
      and exists (select 1 from information_schema.columns where table_schema = 'auth' and table_name = 'users' and column_name = 'email_confirmed_at')
      and to_regclass('realtime.messages') is not null" 2>/dev/null | grep -q t; then break; fi
  [ "$i" = 120 ] && { echo "Auth/Realtime schemas did not appear"; exit 1; }
  sleep 2
done
$PSQL -c "create table if not exists public.casama_migrations (name text primary key, applied_at timestamptz not null default now())"
for f in $(ls /migrations/*.sql | sort); do
  name=$(basename "$f")
  if [ -z "$($PSQL -c "select 1 from public.casama_migrations where name = '$name'")" ]; then
    echo "applying $name"
    $PSQL -1 -f "$f"
    $PSQL -c "insert into public.casama_migrations (name) values ('$name')"
  fi
done
# The worker's least-privilege role (D-095) logs in with its own password.
if [ -n "${WORKER_DB_PASSWORD:-}" ]; then
  $PSQL -c "alter role casama_worker with login password '$WORKER_DB_PASSWORD'"
fi
echo "migrations up to date"
'''

[[config.mounts]]
filePath = "/volumes/caddy/Caddyfile"
content = '''
# infra/compose/selfhost/Caddyfile, for plain HTTP behind Dokploy's proxy.
:80 {
  encode zstd gzip
  @supabase path /auth/v1/* /rest/v1/* /realtime/v1/*
  handle @supabase {
    reverse_proxy kong:8000
  }
  @api path /v1/* /hooks/* /link/* /telemetry/* /telephony/* /oauth/* /mcp /mcp/* /a2a/* /links/* /openapi.json /docs /docs/* /healthz /readyz /.well-known/apple-app-site-association /.well-known/assetlinks.json /.well-known/oauth-protected-resource /.well-known/oauth-protected-resource/* /.well-known/oauth-authorization-server
  handle @api {
    reverse_proxy api:8787
  }
  handle {
    reverse_proxy web:80
  }
  handle_errors 502 {
    @join path /join/* /invites/*
    handle @join {
      rewrite /invites/* /join/{path.1}
      reverse_proxy api:8787
    }
    handle {
      @root path /
      respond @root "Casama is running. Point the Casama app or CLI at this address." 200
      respond "Casama isn't ready yet (or this part isn't running)." 502
    }
  }
  header {
    X-Content-Type-Options nosniff
    Referrer-Policy no-referrer
  }
}
'''
