# Render Blueprint: Kasama API and worker (computers via Cloud Connect, E2B/Daytona or the desktop
# companion; see deploy/README.md). Supabase provides Postgres and Auth.
services:
  - type: web
    name: kasama-api
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - { key: MODE, value: api }
      - { key: PORT, value: "8787" }
      - { fromGroup: kasama }
  - type: worker
    name: kasama-worker
    runtime: docker
    dockerfilePath: apps/server/Dockerfile
    dockerContext: .
    envVars:
      - { key: MODE, value: worker }
      - { key: API_INTERNAL_URL, fromService: { type: web, name: kasama-api, property: hostport } }
      - { fromGroup: kasama }
envVarGroups:
  - name: kasama
    envVars:
      - { key: NODE_ENV, value: production }
      - { key: DATABASE_URL, sync: false }
      - { key: SUPABASE_URL, sync: false }
      - { key: SUPABASE_ANON_KEY, sync: false }
      - { key: SUPABASE_JWT_SECRET, sync: false }
      - { key: PUBLIC_APP_URL, sync: false }
      - { key: INTERNAL_TOKEN, generateValue: true }
      - { key: METRICS_TOKEN, generateValue: true }
      - { key: KASAMA_CLOUD_URL, sync: false }
      - { key: KASAMA_CLOUD_KEY, sync: false }
