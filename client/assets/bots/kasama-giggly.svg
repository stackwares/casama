    </g></g>
  <ellipse class="cheekL" cx="73" cy="165" rx="15.6" ry="9.6" fill="url(#kcCheek)"/><ellipse class="cheekR" cx="186" cy="159" rx="13.2" ry="8.4" fill="url(#kcCheek)"/><path class="arcL" d="M81.9 146Q97 130.1 112.1 146" fill="none" stroke="#3B1452" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><path class="arcR" d="M150.4 142Q163 128.4 175.6 142" fill="none" stroke="#3B1452" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/><g class="laugh"><path d="M116 160Q130 164 144 160Q143.5 180 130 180Q116.5 180 116 160Z" fill="#D9475E"/><ellipse cx="130" cy="179" rx="9" ry="6" fill="#FF8F98" clip-path="url(#kcMouth)"/></g>
  
  
