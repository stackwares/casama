  <ellipse cx="128" cy="238" rx="66" ry="8" fill="url(#kcGround)"/>
  <path d="M82.8 104.8C44.8 99.2 27.9 79.4 51.6 59.1C75.2 38.6 134.9 32.5 183.1 53.9L184.9 50.1C137.1 27.5 70.8 33.4 46.4 52.9C22.1 72.6 43.2 108.8 81.2 115.2Z" fill="url(#kcTail)" filter="url(#kcEdge)"/><circle cx="184" cy="52" r="36" fill="url(#kcGlow)"/><g><circle cx="184" cy="52" r="18" fill="url(#kcOrb)"/><ellipse cx="178.5" cy="46" rx="5.5" ry="3.6" fill="#FFFFFF" opacity=".92" transform="rotate(-25 178.5 46)"/></g>
