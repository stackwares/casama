    <filter id="kcSoft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="1.6"/></filter>
    <clipPath id="kcCloud"><circle cx="110" cy="112" r="50"/><circle cx="176" cy="130" r="36"/><circle cx="205" cy="163" r="27"/><circle cx="178" cy="190" r="29"/><circle cx="128" cy="197" r="28"/><circle cx="80" cy="189" r="29"/><circle cx="50" cy="158" r="28"/><circle cx="68" cy="130" r="23"/><ellipse cx="128" cy="158" rx="84" ry="44"/></clipPath>
    <clipPath id="kcEyeL"><ellipse cx="97" cy="142" rx="21" ry="23"/></clipPath>
    <clipPath id="kcEyeR"><ellipse cx="163" cy="138" rx="17.5" ry="19.5"/></clipPath>
    <clipPath id="kcMouth"><path d="M116 160Q130 164 144 160Q143.5 180 130 180Q116.5 180 116 160Z"/></clipPath>
