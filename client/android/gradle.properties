org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Size: mobile_scanner uses ML Kit from Google Play services (about 6 MB less per ABI) instead of
# bundling it. AndroidManifest.xml asks Play services to fetch the barcode model at install time.
dev.steenbakker.mobile_scanner.useUnbundled=true
# One build number everywhere: without this, --split-per-abi adds 1000 x ABI code to each split
# APK's versionCode (arm64 = 2000 + build), so a later universal APK on App Distribution looked
# like a downgrade. Split APKs now share pubspec's build number; Play gets app bundles anyway.
force-version-code-ignoring-abi=true
