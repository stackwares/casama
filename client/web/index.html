<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Casama brings your AI companions together in one place.">

  <!-- Link preview cards (WhatsApp, Slack, iMessage, X). Images must be absolute URLs: a self-hoster
       serving this web app elsewhere replaces https://app.casama.ai with their own address. -->
  <!-- Open Graph -->
  <meta property="og:title" content="Casama">
  <meta property="og:description" content="Casama brings your AI companions together in one place.">
  <meta property="og:image" content="https://app.casama.ai/og-image.png">
  <meta property="og:url" content="https://app.casama.ai/">
  <meta property="og:type" content="website">

  <!-- X / Twitter -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Casama">
  <meta name="twitter:description" content="Casama brings your AI companions together in one place.">
  <meta name="twitter:image" content="https://app.casama.ai/og-image.png">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Casama">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Casama</title>
  <link rel="manifest" href="manifest.json">
  <!-- Launch screen until Flutter draws its first frame (image from scripts/casama-splash.py).
       The float rests at the same centred 160px box Flutter's first frame draws. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FCF3FB; }
    #splash { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
    #splash img { width: 160px; height: auto; animation: casama-splash 2.6s ease-in-out infinite; }
    @keyframes casama-splash {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-8px) scale(1.035); }
    }
    @media (prefers-reduced-motion: reduce) {
      #splash img { animation: none; }
    }
    @media (prefers-color-scheme: dark) { html, body { background: #25102F; } }
  </style>
</head>
<body>
  <div id="splash" aria-hidden="true"><img src="splash/casama.png" alt=""></div>
  <script>
    window.addEventListener('flutter-first-frame', function () {
      var s = document.getElementById('splash');
      if (s) s.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- Live-call audio playback (flutter_soloud). -->
  <script src="assets/packages/flutter_soloud/web/init_soloud.js" defer></script>
  <!-- Passkeys on web (passkeys_web needs window.PasskeyAuthenticator before the app starts).
       Built from the JS source shipped in passkeys_web 2.11.0; rebuild it when that package moves. -->
  <script src="passkeys/bundle.js"></script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
