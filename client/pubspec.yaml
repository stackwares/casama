name: kasama_app
description: "Kasama: persistent AI teammates."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  kasama_sdk:
    path: ../dart/kasama_sdk
  kasama_computerd:
    path: ../dart/computerd
  kasama_api:
    path: ../dart/kasama_api
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  xterm: ^4.0.0
  markdown_widget: ^2.3.2+8
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  sentry_flutter: ^10.3.0
  web_socket_channel: ^3.0.3
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_webrtc: ^1.6.3
  posthog_flutter: ^5.60.0
  record: ^7.1.2
  just_audio: ^0.10.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  hotkey_manager: ^0.3.0
  home_widget: ^0.10.0
  live_activities: ^2.6.0
  receive_sharing_intent: ^1.9.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.5

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray_icon.png

# The SDK depends on the published kasama_api; in this repo both come from source.
dependency_overrides:
  kasama_api:
    path: ../dart/kasama_api
