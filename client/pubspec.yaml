name: kasama_app
description: "Kasama: persistent AI teammates."
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  kasama_sdk:
    path: ../dart/kasama_sdk
  kasama_api:
    path: ../dart/kasama_api
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.0.0
  go_router: ^18.1.3
  xterm: ^4.0.0
  markdown_widget: ^2.3.2+8
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  sentry_flutter: ^10.3.0
  web_socket_channel: ^3.0.3
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
