name: casama_app
description: "Casama: persistent AI teammates."
publish_to: none
version: 0.8.0+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  casama_sdk:
    path: ../dart/casama_sdk
  casama_computerd:
    path: ../dart/computerd
  casama_api:
    path: ../dart/casama_api
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  xterm: ^4.0.0
  markdown_widget: ^2.3.2+8
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  sentry_flutter: ^10.3.0
  web_socket_channel: ^3.0.3
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  web: ^1.1.2
  flutter_webrtc: ^1.6.3
  posthog_flutter: ^5.60.0
  record: ^7.1.2
  just_audio: ^0.10.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  hotkey_manager: ^0.3.0
  home_widget: ^0.10.0
  live_activities: ^2.6.0
  receive_sharing_intent: ^1.9.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.5
  shared_preferences: ^2.5.6
  flex_color_scheme: ^8.4.0
  image_picker: ^1.2.4
  desktop_drop: ^0.8.0
  path_parsing: ^1.1.0
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.2
  a2ui_flutter: ^0.2.0
  a2ui_core: ^0.6.0
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  fl_chart: ^1.3.1
  flutter_svg: ^2.3.2
  mobile_scanner: ^7.5.0
  quick_actions: ^1.1.1
  drift: ^2.35.4
  drift_flutter: ^0.3.1
  flutter_callkit_incoming: ^3.1.6
  sherpa_onnx: ^2.0.1
  archive: ^4.6.0
  crypto: ^3.0.8
  sign_in_with_apple: ^8.2.0
  device_calendar: ^4.3.3
  flutter_contacts: ^2.6.0
  health: ^13.3.2
  native_geofence: ^1.5.1
  geolocator: ^14.0.1
  notification_listener_service: ^1.0.0
  auto_updater: ^1.0.0
  package_info_plus: ^10.2.2
  pub_semver: ^2.2.1
  flutter_soloud: ^5.2.3
  qr_flutter: ^4.1.0
  lottie: ^3.8.2
  audio_session: ^0.2.4
  passkeys: ^2.24.1
  haptic_feedback: 0.8.0
  stupid_simple_sheet: 0.9.1+1
  phone_numbers_parser: ^9.0.29
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray_icon.png
    - assets/branding/casama_mascot_icon.png
    - assets/mascots/
    - assets/apps/
  # Type (D-087, D-163): Libre Baskerville for headings and Lato for text by default; Google Sans,
  # Noto Serif, Figtree and Fraunces as offline options; JetBrains Mono for code. All SIL Open Font
  # License 1.1 (assets/fonts/*-OFL.txt). Other Google Fonts download on demand when picked.
  fonts:
    - family: Libre Baskerville
      fonts:
        - asset: assets/fonts/LibreBaskerville-Regular.ttf
          weight: 400
        - asset: assets/fonts/LibreBaskerville-Bold.ttf
          weight: 700
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# The SDK depends on the published casama_api; in this repo both come from source.
dependency_overrides:
  casama_api:
    path: ../dart/casama_api
