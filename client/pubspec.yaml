name: kasama_app
description: "Kasama: persistent AI teammates."
publish_to: none
version: 0.8.0+8

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3
  kasama_sdk:
    path: ../dart/kasama_sdk
  kasama_computerd:
    path: ../dart/computerd
  kasama_api:
    path: ../dart/kasama_api
  supabase_flutter: ^2.18.3
  flutter_riverpod: ^3.5.0
  go_router: ^18.1.3
  xterm: ^4.0.0
  markdown_widget: ^2.3.2+8
  file_picker: ^13.3.2
  share_plus: ^13.3.1
  sentry_flutter: ^10.3.0
  web_socket_channel: ^3.0.3
  dio: ^5.11.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  flutter_webrtc: ^1.6.3
  posthog_flutter: ^5.60.0
  record: ^7.1.2
  just_audio: ^0.10.6
  http: ^1.6.0
  flutter_secure_storage: ^11.2.0
  window_manager: ^0.6.0
  tray_manager: ^0.8.3
  hotkey_manager: ^0.3.0
  home_widget: ^0.10.0
  live_activities: ^2.6.0
  receive_sharing_intent: ^1.9.0
  in_app_purchase: ^3.3.1
  url_launcher: ^6.3.3
  in_app_purchase_android: ^0.5.5
  shared_preferences: ^2.5.6
  flex_color_scheme: ^8.4.0
  image_picker: ^1.2.4
  desktop_drop: ^0.8.0
  path_provider: ^2.1.6
  lucide_icons_flutter: ^4.0.2
  a2ui_flutter: ^0.2.0
  a2ui_core: ^0.6.0
  cupertino_icons: ^2.0.0
  google_fonts: ^9.0.0
  fl_chart: ^1.3.1
  flutter_svg: ^2.3.2
  mobile_scanner: ^7.5.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/tray_icon.png
    - assets/branding/kasama_mascot_icon.png
    - assets/mascots/
    - assets/apps/
  # Type (D-087): Google Sans and Noto Serif by default; Figtree and Fraunces as offline options;
  # JetBrains Mono for code. All SIL Open Font License 1.1 (assets/fonts/*-OFL.txt). Other Google
  # Fonts download on demand when picked in Settings.
  fonts:
    - family: Google Sans
      fonts:
        - asset: assets/fonts/GoogleSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/GoogleSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/GoogleSans-Bold.ttf
          weight: 700
    - family: Noto Serif
      fonts:
        - asset: assets/fonts/NotoSerif-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/NotoSerif-Bold.ttf
          weight: 700
    - family: Fraunces
      fonts:
        - asset: assets/fonts/Fraunces-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Fraunces-Bold.ttf
          weight: 700
    - family: Figtree
      fonts:
        - asset: assets/fonts/Figtree-Regular.ttf
          weight: 400
        - asset: assets/fonts/Figtree-Medium.ttf
          weight: 500
        - asset: assets/fonts/Figtree-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Figtree-Bold.ttf
          weight: 700
        - asset: assets/fonts/Figtree-ExtraBold.ttf
          weight: 800
    - family: JetBrains Mono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700

# The SDK depends on the published kasama_api; in this repo both come from source.
dependency_overrides:
  kasama_api:
    path: ../dart/kasama_api
