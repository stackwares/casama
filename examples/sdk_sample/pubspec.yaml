name: casama_sdk_sample
description: An external app built on the published casama_sdk package. Streams a bot's run live.
publish_to: none
environment:
  sdk: ^3.13.0
dependencies:
  # As published on pub.dev.
  casama_sdk: ^0.8.0
  args: ^2.7.0
# Until 0.8.0 is on pub.dev (see docs/NEEDS-FROM-OLIVER.md), resolve the same versions from this
# repository. Delete this block to use the published packages.
dependency_overrides:
  casama_sdk:
    path: ../../dart/casama_sdk
  casama_api:
    path: ../../dart/casama_api
